spring.application.name=core
# Prefijo de todas las rutas del API (ej. /sga-api detras del reverse proxy).
# Vacio = el API responde en la raiz, como en local.
server.servlet.context-path=${SISA_CONTEXT_PATH:}

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sisa?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${DB_FORMAT_SQL:false}
spring.test.database.replace=none
sisa.security.jwt.secret=${JWT_SECRET:dev-only-insecure-256bit-secret-change-me!!}
sisa.security.jwt.access-token-ttl=PT30M
sisa.security.jwt.refresh-token-ttl=P1D
sisa.security.password-reset.token-ttl=PT30M
sisa.security.password-reset.frontend-base-url=${SISA_FRONTEND_BASE_URL:http://localhost:5173}
sisa.security.cors.allowed-origins=${SISA_CORS_ALLOWED_ORIGINS:}
# One shared password for the dev/test accounts (admin, servicios escolares,
# finanzas, director). Blank => no seed accounts are created at all.
sisa.security.bootstrap.test.password=${SISA_TEST_PASSWORD:}
# Plazo de pago de la ficha: N dias desde el registro. El dia del registro es el
# dia 0 y el pago cierra a las 23:59:59 del dia N. Es la ventana privada de la
# ficha, distinta del cierre de admision (closes_at) y de la vigencia del
# concepto (payment_concept.available_until); para poder pagar tienen que estar
# vivos los tres, y manda el que se cumpla primero.
sisa.admission.payment.deadline-days=${SISA_PAGO_DIAS:10}
# Minutos que un intento de pago en linea (sesion EVO) aparta un lugar del cupo:
# un intento abierto mas viejo deja de contar, sin que ningun job lo libere.
sisa.admission.payment.checkout-hold-minutes=${SISA_CHECKOUT_HOLD_MINUTES:15}
# Zona del calendario de admision. opens_at/closes_at se guardan como Instant UTC,
# pero el personal y el Aspirante los leen como fechas locales: sin fijar la zona,
# un servidor en UTC resolveria "abre 01/09 00:00" a 31/08 y mandaria al Aspirante
# el dia equivocado. No cambiar sin revisar la serializacion del frontend.
sisa.admission.zone=${SISA_ADMISSION_ZONE:America/Mexico_City}
sisa.mail.fail-fast=${SISA_MAIL_FAIL_FAST:false}
sisa.evo.base-url=${EVO_BASE_URL:}
sisa.evo.api-username=${EVO_API_USERNAME:}
sisa.evo.api-password=${EVO_API_PASSWORD:}
sisa.evo.merchant-id=${EVO_MERCHANT_ID:}
sisa.evo.checkout-js-url=${EVO_CHECKOUT_JS_URL:}
sisa.evo.return-url=${EVO_RETURN_URL:}
sisa.evo.cancel-url=${EVO_CANCEL_URL:}
sisa.evo.order-id-prefix=${EVO_ORDER_ID_PREFIX:}
sisa.evo.order-id-length=${EVO_ORDER_ID_LENGTH:40}
sisa.evo.currency=${EVO_CURRENCY:MXN}
sisa.evo.merchant-name=${EVO_MERCHANT_NAME:}

# Llave Morelos / Digital Morelos - OAuth 2.0 Authorization Code + PKCE.
# Faltantes = la app arranca igual y GET /auth/llave-mx/status responde
# configured:false, asi que el frontend esconde el boton en vez de mandar a
# nadie a un flujo que no puede completarse. Mismo criterio que EvoPayments.
sisa.llave-mx.client-id=${LLAVE_CLIENT_ID:}
sisa.llave-mx.client-secret=${LLAVE_CLIENT_SECRET:}
sisa.llave-mx.authorize-url=${LLAVE_AUTHORIZE_URL:https://simple.morelos.gob.mx/oauth/authorize}
sisa.llave-mx.token-url=${LLAVE_TOKEN_URL:https://hub.morelos.gob.mx/oauth/token}
sisa.llave-mx.refresh-url=${LLAVE_REFRESH_URL:https://hub.morelos.gob.mx/oauth/token/refresh}
# Sin omision a proposito: la documentacion del proveedor se contradice
# (/api/v1/llave/morelos/entity en la tabla, /api/v1/llave/digital/entity en el
# ejemplo) y adivinar hace fallar el flujo en produccion. Se define en el .env
# cuando el hub confirme la ruta registrada.
sisa.llave-mx.entity-url=${LLAVE_ENTITY_URL:}
# data.person no trae un "sub" de OAuth, asi que el identificador con el que se
# vincula la cuenta sale de otro campo de esa misma persona. curp es el valor por
# omision porque es con lo que SISA identifica las fichas; si el hub resulta usar
# otro (por ejemplo key_mx_id), se cambia aqui y nada mas.
sisa.llave-mx.subject-field=${LLAVE_SUBJECT_FIELD:curp}
# Callback tal cual quedo registrado en el hub; cualquier diferencia la
# rechaza el proveedor, por eso viene del ambiente y no de la peticion.
sisa.llave-mx.redirect-uri=${LLAVE_REDIRECT_URI:}
sisa.llave-mx.scope=${LLAVE_SCOPE:read:profile receive:notifications accept:tos accept:privacy}
sisa.llave-mx.prompt=${LLAVE_PROMPT:consent}
# Origen publico del front: ahi vuelve el navegador tras el callback y de ahi
# se toma la decision de marcar la cookie del flujo como Secure.
sisa.llave-mx.frontend-base-url=${SISA_FRONTEND_BASE_URL:http://localhost:5173}
# Vida de la cookie que guarda state + code_verifier. Solo cubre el salto al
# consentimiento: 5 min alcanzan y acota la ventana de reutilizacion.
sisa.llave-mx.flow-ttl=PT5M
# Vida del ticket de verificacion del candidato: debe alcanzar para llenar la
# ficha y nada mas. Acota que tan tarde puede seguir siendo bueno un enlace.
sisa.llave-mx.verification-ticket-ttl=PT10M
# Timeout de las llamadas al proveedor: una llave que no responde no puede
# dejar un login abierto indefinidamente.
sisa.llave-mx.timeout=PT10S

# In-app paths POST /candidates/{id}/payments/checkout may use as the gateway
# returnUrl, so each payment flow comes back to its own screen. Anything else
# is ignored and the return-url above is used instead - the allowlist is what
# keeps a client-supplied path from becoming an open redirect. The scheme and
# host always come from return-url; only the path is ever swapped.
sisa.evo.allowed-return-paths=/portal/registro/ficha,/portal/ficha/pago

# Exigir la verificacion con LlaveMX para registrar ficha (RF-AUTH-003).
# false = transitional: si no hay ticket valido se respeta el
# llaveMxVerified que llega en el cuerpo, como antes de la integracion.
# true = estricto: sin ticket firmado no hay ficha y el cuerpo se ignora.
# Ponerlo en true solo cuando LLAVE_CLIENT_ID/SECRET/ENTITY_URL esten
# configurados, o el registro publico se queda sin salida.
sisa.admission.candidate.llave-mx-required=${SISA_CANDIDATE_LLAVE_MX_REQUIRED:false}

# Throttle for POST /candidates/payment-access (folio + last 3 CURP chars).
# Locking an applicant out of their own payment screen beats letting a script
# enumerate the sequential folio range.
sisa.admission.payment-access.max-attempts=10
sisa.admission.payment-access.window-minutes=10
